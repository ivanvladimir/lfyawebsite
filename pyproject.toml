[tool.poetry]
name = "lfyawebsite"
version = "0.1.2"
description = "Sitio web para el curso de LFyA de FI-UNAM"
authors = ["Ivan Vladimir Meza Ruiz <ivanvladimir@gmail.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.1"
pymongo = "^4.8.0"
motor = "^3.5.1"
passlib = "^1.7.4"
pydantic-settings = "^2.3.4"
pyjwt = "^2.8.0"
jinja2 = "^3.1.4"
pydantic-mongo = "^2.3.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
